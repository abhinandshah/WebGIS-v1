{% extends "base.html" %}

{% block content %}
<div class="gis-wrapper">
    <header class="gis-header">
        <div class="header-left">
            <a href="/dashboard" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
        <div class="header-center">
            <h4>House Numbering System</h4>
        </div>
        <div class="header-right">
            <div class="dropdown">
                <button class="btn btn-light btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    <i class="fas fa-user-circle"></i> {{ user.name }}
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </header>
    

    <div class="gis-content">
        <aside class="gis-sidebar">
            <div class="sidebar-section">
                <h5><i class="fas fa-home"></i> House Filters</h5>
                <div class="form-group">
                    <label>Ward</label>
                    <select id="wardFilter" class="form-select form-select-sm" onchange="filterHouses()">
                        <option value="">All Wards</option>
                    </select>
                </div>
                <div class="layer-toggle-section">
                    <h6><i class="fas fa-layer-group"></i> Layers</h6>
                    <label class="layer-checkbox">
                        <input type="checkbox" checked id="housesLayer"> Show Houses
                    </label>
                    <label class="layer-checkbox">
                        <input type="checkbox" checked id="streetsLayer"> Show Streets
                    </label>
                    <label class="layer-checkbox">
                        <input type="checkbox" id="labelsLayer"> Show Labels
                    </label>
                </div>
            </div>
        </aside>
        <div id="map" class="gis-map"></div>
    </div>
</div>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; }
    .gis-wrapper { height: 100vh; display: flex; flex-direction: column; }
    .gis-header { background: #2c3e50; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .back-link { color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .back-link:hover { color: #3498db; }
    .header-center h4 { margin: 0; font-weight: 600; }
    .search-bar { background: white; padding: 15px 20px; display: flex; gap: 15px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; }
    .search-inputs { display: flex; gap: 10px; flex: 1; flex-wrap: wrap; }
    .search-inputs input, .search-inputs select { flex: 1; min-width: 150px; }
    .search-actions { display: flex; gap: 10px; }
    .gis-content { display: flex; flex: 1; overflow: hidden; }
    .gis-sidebar { width: 280px; background: #2c3e50; color: white; overflow-y: auto; padding: 20px; }
    .sidebar-section h5 { font-size: 1.1rem; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #34495e; }
    .sidebar-section h6 { font-size: 0.95rem; margin-top: 15px; margin-bottom: 10px; color: #ecf0f1; }
    .layer-toggle-section { margin-top: 20px; }
    .layer-checkbox { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; border-radius: 5px; transition: background 0.2s; font-size: 0.9rem; }
    .layer-checkbox:hover { background: #34495e; }
    .layer-checkbox input { cursor: pointer; }
    .gis-map { flex: 1; position: relative; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
    .house-marker { background: #FF6B6B; border: 2px solid white; border-radius: 50%; width: 20px; height: 20px; }
</style>

<script>
let map, housesLayer;

function initMap() {
    map = L.map('map').setView([26.4525, 87.2718], 14);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
    
    const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
    L.control.layers({"Satellite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'), "Street": street}).addTo(map);
    L.control.scale().addTo(map);
    
    loadHouses();
    loadWards();
}

async function loadHouses() {
    try {
        const response = await fetch('/api/houses');
        const data = await response.json();
        displayHouses(data);
    } catch (error) {
        console.error('Error loading houses:', error);
    }
}

function displayHouses(geojson) {
    if (housesLayer) map.removeLayer(housesLayer);
    
    housesLayer = L.geoJSON(geojson, {
        pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
                radius: 8,
                fillColor: "#FF6B6B",
                color: "#fff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            });
        },
        onEachFeature: function(feature, layer) {
            const props = feature.properties;
            const popup = `
                <div class="popup-content">
                    <h6><i class="fas fa-home"></i> House Information</h6>
                    <table>
                        <tr><td>House No:</td><td>${props.house_no || 'N/A'}</td></tr>
                        <tr><td>Ward:</td><td>${props.ward || 'N/A'}</td></tr>
                        <tr><td>Street:</td><td>${props.street || 'N/A'}</td></tr>
                        <tr><td>Owner:</td><td>${props.owner || 'N/A'}</td></tr>
                        <tr><td>Floors:</td><td>${props.floors || 'N/A'}</td></tr>
                    </table>
                </div>
            `;
            layer.bindPopup(popup);
            layer.bindTooltip(props.house_no || 'Unknown');
        }
    }).addTo(map);
}

async function loadWards() {
    const response = await fetch('/api/wards');
    const wards = await response.json();
    ['wardSelect', 'wardFilter'].forEach(id => {
        const select = document.getElementById(id);
        wards.forEach(ward => {
            const option = document.createElement('option');
            option.value = ward.id;
            option.textContent = ward.name;
            select.appendChild(option);
        });
    });
}

function searchHouse() {
    const houseNo = document.getElementById('houseNo').value;
    if (!houseNo) {
        alert('Please enter a House Number');
        return;
    }
    // Search logic here
}

function clearSearch() {
    document.getElementById('houseNo').value = '';
    document.getElementById('streetName').value = '';
    document.getElementById('wardSelect').value = '';
    loadHouses();
}

function filterHouses() {
    // Filter logic here
}

document.addEventListener('DOMContentLoaded', initMap);
</script>
{% endblock %}
