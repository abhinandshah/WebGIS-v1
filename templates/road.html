{% extends "base.html" %}

{% block content %}
<div class="gis-wrapper">
    <header class="gis-header">
        <div class="header-left">
            <a href="/dashboard" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
        <div class="header-center">
            <h4>Road Network System</h4>
        </div>
        <div class="header-right">
            <div class="dropdown">
                <button class="btn btn-light btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    <i class="fas fa-user-circle"></i> {{ user.name }}
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </header>
    
    <div class="search-bar">
        <div class="search-inputs">
            <input type="text" id="roadName" class="form-control" placeholder="Road Name">
            <select id="roadType" class="form-select">
                <option value="">All Types</option>
                <option value="primary">Primary</option>
                <option value="secondary">Secondary</option>
                <option value="tertiary">Tertiary</option>
            </select>
            <select id="roadStatus" class="form-select">
                <option value="">All Status</option>
                <option value="paved">Paved</option>
                <option value="gravel">Gravel</option>
                <option value="under-construction">Under Construction</option>
            </select>
        </div>
        <div class="search-actions">
            <button class="btn btn-primary" onclick="searchRoad()">
                <i class="fas fa-search"></i> Search
            </button>
            <button class="btn btn-secondary" onclick="clearSearch()">
                <i class="fas fa-times"></i> Clear
            </button>
        </div>
    </div>
    
    <div class="gis-content">
        <aside class="gis-sidebar">
            <div class="sidebar-section">
                <h5><i class="fas fa-road"></i> Road Filters</h5>
                <div class="form-group">
                    <label>Road Type</label>
                    <select id="typeFilter" class="form-select form-select-sm" onchange="filterRoads()">
                        <option value="">All Types</option>
                        <option value="primary">Primary</option>
                        <option value="secondary">Secondary</option>
                        <option value="tertiary">Tertiary</option>
                    </select>
                </div>
                <div class="layer-toggle-section">
                    <h6><i class="fas fa-layer-group"></i> Road Layers</h6>
                    <label class="layer-checkbox">
                        <input type="checkbox" checked class="road-layer" data-type="primary"> Primary Roads
                    </label>
                    <label class="layer-checkbox">
                        <input type="checkbox" checked class="road-layer" data-type="secondary"> Secondary Roads
                    </label>
                    <label class="layer-checkbox">
                        <input type="checkbox" checked class="road-layer" data-type="tertiary"> Tertiary Roads
                    </label>
                </div>
                <div class="layer-toggle-section">
                    <h6><i class="fas fa-wrench"></i> Status</h6>
                    <label class="layer-checkbox">
                        <input type="checkbox" checked> Paved
                    </label>
                    <label class="layer-checkbox">
                        <input type="checkbox" checked> Gravel
                    </label>
                    <label class="layer-checkbox">
                        <input type="checkbox" checked> Under Construction
                    </label>
                </div>
                <div class="stats-section">
                    <h6><i class="fas fa-chart-pie"></i> Network Stats</h6>
                    <div class="stat-item">
                        <span>Total Length:</span>
                        <strong id="totalLength">0 km</strong>
                    </div>
                    <div class="stat-item">
                        <span>Paved:</span>
                        <strong id="pavedLength">0 km</strong>
                    </div>
                    <div class="stat-item">
                        <span>Unpaved:</span>
                        <strong id="unpavedLength">0 km</strong>
                    </div>
                </div>
            </div>
        </aside>
        
        <div class="gis-map">
            <div id="map"></div>
        </div>
    </div>
</div>

<style>
    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
    }
    
    html, body {
        height: 100%;
        overflow: hidden;
    }
    
    .gis-wrapper { 
        height: 100vh; 
        display: flex; 
        flex-direction: column; 
    }
    
    .gis-header { 
        background: #2c3e50; 
        color: white; 
        padding: 12px 20px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        z-index: 1000;
        position: relative;
    }
    
    .back-link { 
        color: white; 
        text-decoration: none; 
        display: flex; 
        align-items: center; 
        gap: 8px; 
    }
    
    .back-link:hover { 
        color: #3498db; 
    }
    
    .header-center h4 { 
        margin: 0; 
        font-weight: 600; 
    }
    
    .search-bar { 
        background: white; 
        padding: 15px 20px; 
        display: flex; 
        gap: 15px; 
        align-items: center; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        flex-wrap: wrap;
        z-index: 999;
        position: relative;
    }
    
    .search-inputs { 
        display: flex; 
        gap: 10px; 
        flex: 1; 
        flex-wrap: wrap; 
    }
    
    .search-inputs input, 
    .search-inputs select { 
        flex: 1; 
        min-width: 150px; 
    }
    
    .search-actions { 
        display: flex; 
        gap: 10px; 
    }
    
    .gis-content { 
        display: flex; 
        flex: 1; 
        overflow: hidden;
        position: relative;
    }
    
    .gis-sidebar { 
        width: 280px; 
        background: #2c3e50; 
        color: white; 
        overflow-y: auto; 
        padding: 20px;
        z-index: 500;
        position: relative;
    }
    
    .sidebar-section h5 { 
        font-size: 1.1rem; 
        margin-bottom: 15px; 
        padding-bottom: 10px; 
        border-bottom: 2px solid #34495e; 
    }
    
    .sidebar-section h6 { 
        font-size: 0.95rem; 
        margin-top: 15px; 
        margin-bottom: 10px; 
        color: #ecf0f1; 
    }
    
    .layer-toggle-section { 
        margin-top: 20px; 
    }
    
    .layer-checkbox { 
        display: flex; 
        align-items: center; 
        gap: 8px; 
        padding: 8px 10px; 
        cursor: pointer; 
        border-radius: 5px; 
        transition: background 0.2s; 
        font-size: 0.9rem; 
    }
    
    .layer-checkbox:hover { 
        background: #34495e; 
    }
    
    .layer-checkbox input { 
        cursor: pointer; 
    }
    
    .gis-map { 
        flex: 1; 
        position: relative;
        overflow: hidden;
    }
    
    #map {
        width: 100%;
        height: 100%;
        background: #e0e0e0;
    }
    
    .form-group { 
        margin-bottom: 15px; 
    }
    
    .form-group label { 
        display: block; 
        margin-bottom: 5px; 
        font-size: 0.9rem; 
    }
    
    .stats-section { 
        margin-top: 20px; 
        padding: 15px; 
        background: #34495e; 
        border-radius: 8px; 
    }
    
    .stat-item { 
        display: flex; 
        justify-content: space-between; 
        padding: 8px 0; 
        border-bottom: 1px solid #4a5f7f; 
    }
    
    .stat-item:last-child { 
        border-bottom: none; 
    }
    
    /* Popup styling */
    .leaflet-popup-content {
        margin: 15px;
        min-width: 200px;
    }
    
    .popup-content h6 {
        margin-bottom: 10px;
        color: #2c3e50;
        border-bottom: 2px solid #3498db;
        padding-bottom: 5px;
        font-size: 1rem;
    }
    
    .popup-content table {
        width: 100%;
        border-collapse: collapse;
    }
    
    .popup-content td {
        padding: 6px 4px;
        font-size: 0.9rem;
        border-bottom: 1px solid #ecf0f1;
    }
    
    .popup-content td:first-child {
        font-weight: 600;
        color: #555;
        width: 40%;
    }
    
    .popup-content td:last-child {
        color: #2c3e50;
    }
</style>

<script>
let map;
let roadsLayer;
let currentRoads = [];

/* ================= INIT MAP ================= */
function initMap() {
    console.log('Initializing Road Network map...');
    
    // Check Leaflet
    if (typeof L === 'undefined') {
        console.error('ERROR: Leaflet not loaded!');
        alert('Error: Map library failed to load. Please refresh the page.');
        return;
    }
    
    // Create map
    map = L.map('map', {
        center: [26.4525, 87.2718],
        zoom: 14,
        zoomControl: true
    });
    
    console.log('✓ Map created');

    /* -------- BASE MAPS -------- */
    const satellite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { 
            attribution: 'Esri',
            maxZoom: 19 
        }
    );

    const street = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        { 
            attribution: '© OpenStreetMap',
            maxZoom: 19 
        }
    );

    const terrain = L.tileLayer(
        'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
        { 
            attribution: 'OpenTopoMap',
            maxZoom: 17 
        }
    );

    satellite.addTo(map);

    /* -------- LAYER CONTROL (TOP RIGHT) -------- */
    L.control.layers(
        {
            "🛰 Satellite": satellite,
            "🗺 Street": street,
            "⛰ Terrain": terrain
        },
        null,
        { position: "topright" }
    ).addTo(map);

    /* -------- FULLSCREEN CONTROL (TOP LEFT) -------- */
    const FullscreenControl = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function() {
            const btn = L.DomUtil.create('button', 'leaflet-bar leaflet-control');
            btn.innerHTML = '<i class="fas fa-expand"></i>';
            btn.title = 'Toggle Fullscreen';
            btn.style.cssText = 'background:white; width:34px; height:34px; border:2px solid rgba(0,0,0,0.2); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center;';
            
            btn.onclick = function(e) {
                e.preventDefault();
                const mapEl = document.getElementById('map');
                if (!document.fullscreenElement) {
                    mapEl.requestFullscreen().then(() => {
                        btn.innerHTML = '<i class="fas fa-compress"></i>';
                    }).catch(err => {
                        console.error('Fullscreen error:', err);
                    });
                } else {
                    document.exitFullscreen().then(() => {
                        btn.innerHTML = '<i class="fas fa-expand"></i>';
                    });
                }
            };
            return btn;
        }
    });
    
    map.addControl(new FullscreenControl());
    console.log('✓ Fullscreen control added');

    /* -------- SCALE CONTROL -------- */
    L.control.scale({ 
        position: "bottomleft",
        imperial: false 
    }).addTo(map);

    // Load roads data
    loadRoads();

    // Force map resize
    setTimeout(() => {
        map.invalidateSize();
        console.log('✓ Map resized');
    }, 100);
}

/* ================= LOAD ROADS FROM API ================= */
async function loadRoads() {
    console.log('========================================');
    console.log('LOADING ROADS - START');
    console.log('========================================');
    console.log('API URL: /api/roads');
    
    try {
        console.log('Step 1: Fetching from /api/roads...');
        const response = await fetch('/api/roads');
        
        console.log('Step 2: Response received');
        console.log('  Status:', response.status);
        console.log('  Status Text:', response.statusText);
        console.log('  OK:', response.ok);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        console.log('Step 3: Parsing JSON...');
        const data = await response.json();
        
        console.log('Step 4: Data received:');
        console.log('  Type:', data.type);
        console.log('  Features:', data.features);
        console.log('  Features count:', data.features ? data.features.length : 0);
        console.log('  Full data:', JSON.stringify(data, null, 2));
        
        currentRoads = data.features || [];
        
        if (currentRoads.length === 0) {
            console.warn('⚠ WARNING: No road features found in GeoJSON');
            console.warn('  This means the GeoJSON file is empty or not loading correctly');
            alert('No road data found!\n\nCheck:\n1. Does static/data/roads.geojson exist?\n2. Is the file empty?\n3. Check browser console for details.');
        } else {
            console.log('Step 5: Displaying roads...');
            displayRoads(data);
            console.log('Step 6: Updating statistics...');
            updateStats(data);
            console.log('✓✓✓ ROADS LOADED SUCCESSFULLY ✓✓✓');
        }
        
    } catch (error) {
        console.error('========================================');
        console.error('❌ ERROR LOADING ROADS');
        console.error('========================================');
        console.error('Error type:', error.name);
        console.error('Error message:', error.message);
        console.error('Full error:', error);
        console.error('Stack:', error.stack);
        
        alert('Error loading road data!\n\n' + 
              'Error: ' + error.message + '\n\n' +
              'Please check:\n' +
              '1. Flask server is running\n' +
              '2. File exists: static/data/roads.geojson\n' +
              '3. Browser console (F12) for details');
    }
    
    console.log('========================================');
    console.log('LOADING ROADS - END');
    console.log('========================================');
}

/* ================= DISPLAY ROADS ON MAP ================= */
function displayRoads(geojson) {
    console.log('Displaying roads on map...');
    
    if (!map) {
        console.error('Map not initialized');
        return;
    }
    
    // Remove existing layer
    if (roadsLayer) {
        map.removeLayer(roadsLayer);
    }
    
    const typeColors = {
        'Primary': '#E74C3C',
        'Secondary': '#F39C12',
        'Tertiary': '#3498DB',
        'primary': '#E74C3C',
        'secondary': '#F39C12',
        'tertiary': '#3498DB'
    };
    
    roadsLayer = L.geoJSON(geojson, {
        style: function(feature) {
            const roadType = feature.properties.road_type || feature.properties.type || '';
            const color = typeColors[roadType] || '#95A5A6';
            const weight = roadType.toLowerCase() === 'primary' ? 5 : 3;
            
            return {
                color: color,
                weight: weight,
                opacity: 0.8
            };
        },
        onEachFeature: function(feature, layer) {
            const props = feature.properties;
            
            // Create popup with ALL attributes
            let popupContent = '<div class="popup-content"><h6><i class="fas fa-road"></i> Road Information</h6><table>';
            
            for (const key in props) {
                if (props.hasOwnProperty(key)) {
                    const formattedKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    popupContent += `<tr><td>${formattedKey}:</td><td>${props[key] || 'N/A'}</td></tr>`;
                }
            }
            
            popupContent += '</table></div>';
            
            layer.bindPopup(popupContent, { maxWidth: 300 });
            
            // Tooltip
            const roadName = props.road_name || props.name || 'Unknown Road';
            layer.bindTooltip(roadName, {
                permanent: false,
                direction: 'center'
            });
            
            // Highlight on click
            layer.on('click', function() {
                layer.setStyle({
                    color: '#FFFF00',
                    weight: 6,
                    opacity: 1
                });
            });
            
            layer.on('popupclose', function() {
                roadsLayer.resetStyle(layer);
            });
        }
    }).addTo(map);
    
    console.log('✓ Roads displayed');
    
    // Zoom to roads
    if (geojson.features && geojson.features.length > 0) {
        try {
            const bounds = roadsLayer.getBounds();
            map.fitBounds(bounds, { padding: [50, 50] });
            console.log('✓ Zoomed to roads bounds');
        } catch (e) {
            console.warn('Could not zoom to bounds:', e);
        }
    }
}

/* ================= UPDATE STATISTICS ================= */
function updateStats(geojson) {
    if (!geojson.features || geojson.features.length === 0) {
        document.getElementById('totalLength').textContent = '0 km';
        document.getElementById('pavedLength').textContent = '0 km';
        document.getElementById('unpavedLength').textContent = '0 km';
        return;
    }
    
    // Calculate approximate total length
    const total = geojson.features.length * 1.5;
    document.getElementById('totalLength').textContent = `${total.toFixed(1)} km`;
    document.getElementById('pavedLength').textContent = `${(total * 0.6).toFixed(1)} km`;
    document.getElementById('unpavedLength').textContent = `${(total * 0.4).toFixed(1)} km`;
    
    console.log('✓ Stats updated');
}

/* ================= SEARCH ROAD ================= */
function searchRoad() {
    const roadName = document.getElementById('roadName').value.trim().toLowerCase();
    
    if (!roadName) {
        alert('Please enter a road name to search');
        return;
    }
    
    const filtered = {
        type: 'FeatureCollection',
        features: currentRoads.filter(f => {
            const name = (f.properties.road_name || f.properties.name || '').toLowerCase();
            return name.includes(roadName);
        })
    };
    
    if (filtered.features.length > 0) {
        displayRoads(filtered);
        console.log('Found', filtered.features.length, 'roads matching:', roadName);
    } else {
        alert('No roads found with name: ' + roadName);
        loadRoads();
    }
}

/* ================= CLEAR SEARCH ================= */
function clearSearch() {
    document.getElementById('roadName').value = '';
    document.getElementById('roadType').value = '';
    document.getElementById('roadStatus').value = '';
    document.getElementById('typeFilter').value = '';
    loadRoads();
    console.log('Search cleared');
}

/* ================= FILTER ROADS ================= */
function filterRoads() {
    const selectedType = document.getElementById('typeFilter').value.toLowerCase();
    
    if (!selectedType) {
        loadRoads();
        return;
    }
    
    const filtered = {
        type: 'FeatureCollection',
        features: currentRoads.filter(f => {
            const type = (f.properties.road_type || f.properties.type || '').toLowerCase();
            return type === selectedType;
        })
    };
    
    displayRoads(filtered);
    console.log('Filtered to', selectedType, 'roads:', filtered.features.length);
}

/* ================= INITIALIZE ON DOM READY ================= */
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM Ready - Initializing Road Network System...');
    initMap();
});

// Handle window resize
window.addEventListener('resize', function() {
    if (map) {
        map.invalidateSize();
    }
});
</script>
{% endblock %}
